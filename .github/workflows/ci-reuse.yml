name: CI Reusable

on:
  workflow_call:
    inputs:
      certify:
        description: Run the full certification (replay + journey)
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install tools
        run: |
          make install-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plugin
        run: |
          mkdir -p "${HOME}/.config/nvim"
          ln -sfn "${{ github.workspace }}/nvim" "${HOME}/.config/nvim"

      - name: Verify
        run: go run ./tools/verify
        if: ${{ inputs.certify }}
